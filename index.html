<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="每日论文追踪：按北京时间查看目标期刊的新论文。" />
    <meta name="theme-color" content="#f7f8f5" />
    <title>论文追踪</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("paper-tracker-theme");
          const preference = ["light", "dark", "system"].includes(stored) ? stored : "system";
          const resolved = preference === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : preference;
          document.documentElement.dataset.theme = resolved;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=25b680167f" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=66c050c341" />
    <link rel="shortcut icon" href="assets/favicon.ico?v=c3cd5d7ef3" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=44ad171dcf" />
    <link rel="mask-icon" href="assets/favicon.svg?v=25b680167f" color="#0f766e" />
    <link rel="stylesheet" href="assets/styles.css?v=380ddd7111" />
    <script src="assets/vendor/lucide.min.js?v=3411692820" defer></script>
    <script src="assets/app.js?v=ce2a042421" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#paper-list">跳到论文列表</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" aria-label="论文追踪首页">
          <span class="brand-mark" aria-hidden="true"><i data-lucide="library-big"></i></span>
          <span>
            <strong>论文追踪</strong>
            <small>Daily Paper Tracker</small>
          </span>
        </a>
        <nav class="view-tabs" aria-label="页面视图">
          <button class="view-tab is-active" type="button" data-view="daily">每日论文</button>
          <button class="view-tab" type="button" data-view="history">
            历史及补录
            <span class="tab-count" id="supplement-count" hidden>0</span>
          </button>
          <button class="view-tab" type="button" data-view="archive">
            已归档
            <span class="tab-count" id="archive-count" hidden>0</span>
          </button>
        </nav>
        <div class="header-actions">
          <button class="icon-button" id="settings-button" type="button" title="设置" aria-label="打开设置">
            <i data-lucide="settings-2"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="app-shell">
      <section class="workspace" aria-live="polite">
        <div class="toolbar" id="daily-toolbar">
          <div class="toolbar-title">
            <p class="eyebrow">每日论文</p>
            <strong id="daily-date">昨日</strong>
          </div>
          <div class="toolbar-summary" id="toolbar-summary"></div>
        </div>

        <div class="update-status" id="update-status" role="status" aria-live="polite">
          <span class="update-dot is-loading" aria-hidden="true"></span>
          <span>正在读取数据状态</span>
        </div>

        <div class="toolbar" id="history-toolbar" hidden>
          <div class="date-controls">
            <button class="icon-button" id="previous-day" type="button" title="前一天" aria-label="前一天">
              <i data-lucide="chevron-left"></i>
            </button>
            <label class="date-field">
              <i data-lucide="calendar-days" aria-hidden="true"></i>
              <span class="sr-only">选择日期</span>
              <input id="date-picker" type="date" />
            </label>
            <button class="icon-button" id="next-day" type="button" title="后一天" aria-label="后一天">
              <i data-lucide="chevron-right"></i>
            </button>
            <button class="text-button" id="return-yesterday" type="button">返回昨日</button>
          </div>
          <div class="segmented-control" role="tablist" aria-label="历史与补录">
            <button class="is-active" type="button" role="tab" data-mode="history">历史</button>
            <button type="button" role="tab" data-mode="supplements">补录</button>
          </div>
        </div>

        <div class="archive-toolbar" id="archive-toolbar" hidden>
          <div class="date-controls">
            <button class="icon-button" id="archive-previous" type="button" title="前一天" aria-label="前一天">
              <i data-lucide="chevron-left"></i>
            </button>
            <label class="date-field">
              <i data-lucide="calendar-days" aria-hidden="true"></i>
              <span class="sr-only">选择日期</span>
              <input id="archive-date-picker" type="date" />
            </label>
            <button class="icon-button" id="archive-next" type="button" title="后一天" aria-label="后一天">
              <i data-lucide="chevron-right"></i>
            </button>
            <button class="text-button" id="archive-yesterday" type="button">返回昨日</button>
          </div>
          <div class="archive-actions">
            <span class="archive-selection" id="archive-selection">未选择</span>
            <button class="text-button compact-button" id="archive-select-all" type="button">全选</button>
            <button class="text-button compact-button" id="archive-none" type="button">清除选择</button>
            <button class="text-button compact-button" id="archive-clear" type="button">清空归档</button>
            <button class="text-button compact-button is-primary" id="archive-restore" type="button" disabled>恢复所选</button>
          </div>
        </div>

        <div class="status-strip" id="status-strip" hidden></div>
        <div class="content-heading" id="content-heading"></div>
        <div id="paper-list" class="paper-list" tabindex="-1"></div>
      </section>
    </main>

    <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">设置</p>
          <strong id="settings-title">页面偏好</strong>
        </div>
        <button class="icon-button" id="close-settings" type="button" title="关闭" aria-label="关闭设置">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="settings-body">
        <section class="settings-section">
          <div class="settings-section-heading">
            <div>
              <strong>期刊显示</strong>
              <span id="settings-journal-summary">全部期刊</span>
            </div>
            <button class="text-button compact-button" id="restore-journals" type="button">恢复全部</button>
          </div>
          <p class="settings-note">仅影响当前浏览器的显示范围，不改变服务端的采集范围。</p>
          <div id="settings-journal-list" class="settings-journal-list"></div>
        </section>

        <section class="settings-section">
          <div class="settings-section-heading">
            <div>
              <strong>主题</strong>
              <span>保存到当前浏览器</span>
            </div>
          </div>
          <div class="segmented-control theme-control" role="group" aria-label="选择主题">
            <button type="button" data-theme-option="system">跟随系统</button>
            <button type="button" data-theme-option="light">浅色</button>
            <button type="button" data-theme-option="dark">深色</button>
          </div>
        </section>
      </div>
    </dialog>

    <footer class="site-footer">
      <p>论文日期按来源的首次在线发表日期归档，时区为 Asia/Shanghai。</p>
      <p id="source-note"></p>
    </footer>

    <template id="loading-template">
      <div class="loading-state" aria-label="正在加载">
        <span></span><span></span><span></span>
      </div>
    </template>
  </body>
</html>
