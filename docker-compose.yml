services:
  paper-tracker:
    image: ghcr.io/zenanh/paper-tracker:latest
    container_name: paper-tracker
    restart: unless-stopped
    ports:
      - "${PAPER_TRACKER_TAILSCALE_IP:?set PAPER_TRACKER_TAILSCALE_IP in .env}:${PAPER_TRACKER_PORT:-8899}:80"
      - "127.0.0.1:${PAPER_TRACKER_PORT:-8899}:80"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 仅挂载运行数据；前端代码来自镜像，升级镜像即可升级站点。
      - ${PAPER_TRACKER_DATA_DIR:-./data}:/usr/share/nginx/html/data:ro
    depends_on:
      - archive-api
      - journal-manager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # 「已归档」持久化服务：读写归档状态，不对外发布端口，仅供站点经 nginx 代理访问
  archive-api:
    image: ghcr.io/zenanh/paper-tracker-archive:latest
    container_name: paper-tracker-archive
    restart: unless-stopped
    # 以宿主用户身份运行，归档文件属主为 zhuo 而非 root
    user: "${PAPER_TRACKER_UID:-1000}:${PAPER_TRACKER_GID:-1000}"
    environment:
      - TZ=Asia/Shanghai
      - ARCHIVE_FILE=/archive/archive.json
      - MANIFEST_FILE=/data/manifest.json
      - PORT=8080
    volumes:
      # 可写卷：归档状态独立于静态数据目录
      - ${PAPER_TRACKER_ARCHIVE_DIR:-./archive}:/archive
      - ${PAPER_TRACKER_DATA_DIR:-./data}:/data:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  journal-manager:
    image: ghcr.io/zenanh/paper-tracker-tasks:latest
    container_name: paper-tracker-manager
    restart: unless-stopped
    user: "${PAPER_TRACKER_UID:-1000}:${PAPER_TRACKER_GID:-1000}"
    command: ["python3", "scripts/journal_manager.py"]
    environment:
      - TZ=Asia/Shanghai
      - PAPER_TRACKER_DATA_DIR=/app/data
      - PAPER_TRACKER_JOURNAL_CONFIG=/app/data/journal-config.json
      - ARCHIVE_API_URL=http://archive-api:8080/api/archive
      - MANAGER_PORT=8090
      - CROSSREF_MAILTO=${CROSSREF_MAILTO:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    volumes:
      - ${PAPER_TRACKER_DATA_DIR:-./data}:/app/data
    depends_on:
      archive-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/admin/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  tasks:
    image: ghcr.io/zenanh/paper-tracker-tasks:latest
    profiles: ["tasks"]
    user: "${PAPER_TRACKER_UID:-1000}:${PAPER_TRACKER_GID:-1000}"
    environment:
      - TZ=Asia/Shanghai
      - PAPER_TRACKER_DATA_DIR=/app/data
      - PAPER_TRACKER_JOURNAL_CONFIG=/app/data/journal-config.json
      - CROSSREF_MAILTO=${CROSSREF_MAILTO:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    volumes:
      - ${PAPER_TRACKER_DATA_DIR:-./data}:/app/data
