name: Backfill paper history

on:
  workflow_dispatch:
    inputs:
      translation_limit:
        description: Maximum titles to translate or retranslate in this run
        required: false
        default: "400"
      translation_workers:
        description: Number of concurrent translation requests
        required: false
        default: "4"

concurrency:
  group: paper-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Collect the rolling three-month window
        run: python scripts/collect.py --mode backfill
      - name: Translate a resumable batch
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/translate.py --retranslate-existing --limit "${{ inputs.translation_limit }}" --batch-size 8 --workers "${{ inputs.translation_workers }}"
      - name: Verify generated data
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
      - name: Commit backfilled data
        run: |
          git config user.name "paper-tracker[bot]"
          git config user.email "paper-tracker[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: backfill paper history"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
