name: Quarterly impact factor check

on:
  schedule:
    - cron: "0 18 1 1,4,7,10 *"
  workflow_dispatch:

concurrency:
  group: paper-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python scripts/update_metrics.py
      - name: Verify generated data
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
      - name: Commit verified metric changes
        run: |
          git config user.name "paper-tracker[bot]"
          git config user.email "paper-tracker[bot]@users.noreply.github.com"
          git add data/journals.json
          if git diff --cached --quiet; then
            echo "No metric changes"
          else
            git commit -m "data: check journal impact factors"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
