name: Daily paper update

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: paper-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Collect yesterday's papers and late deposits
        run: python scripts/collect.py --mode daily
      - name: Translate new titles
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/translate.py --limit 1000 --batch-size 8 --workers 4
      - name: Verify generated data
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
      - name: Commit updated data
        run: |
          git config user.name "paper-tracker[bot]"
          git config user.email "paper-tracker[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update daily papers"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
