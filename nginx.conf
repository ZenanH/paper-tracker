server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip（动态压缩；不再依赖预压缩 .gz）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 入口 HTML：始终回源校验，避免旧版本被长期缓存
    # 用 expires -1（效果为 Cache-Control: no-cache）；不用 add_header，
    # 否则会重置上方服务器级安全头的继承。
    # 已归档状态 API（反代到内部服务，不对外暴露端口）
    # 用变量 + resolver 动态解析：容器重启换 IP 后不会代理到陈旧地址
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $archive_backend http://archive-api:8080;
        proxy_pass $archive_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        expires -1;
    }

    # 数据文件：短缓存（每日更新）
    location /data/ {
        expires 1h;
    }
    # 静态资源：长缓存（资源更新时随部署变更）
    location /assets/ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
